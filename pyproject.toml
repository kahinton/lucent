[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lucent"
version = "0.4.0"
description = "Enterprise AI agent platform for durable memory, governed work, and model orchestration"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Lucent Source Available License 1.0"}
authors = [
    { name = "kahinton" }
]
dependencies = [
    "mcp[cli]>=2.3.0,<3.0",
    "asyncpg>=0.32.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "fastapi>=0.163.0,<1.0",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.33,<1.0",
    "bcrypt>=5.0.0",
    "PyNaCl>=1.6.2",
    "docker>=7.2.0",
    "kubernetes>=37.0.2,<38.0.0",
    "httpx>=0.28.1",
    "cryptography>=50.0.2,<51.0",
    # SAML 2.0 assertion signature verification. `signxml` implements XML-DSig
    # over `lxml`'s hardened parser; both are required for the enterprise SSO
    # path and are imported lazily so a password-only deployment never loads
    # them.
    "signxml>=5.3,<6",
    "lxml>=5.2.1,<7",
    "requests>=2.34.2,<3.0",
    "pyasn1>=0.6.5,<1.0",
    "pygments>=2.21.0,<3.0",
    "PyJWT>=2.15.1,<3.0",
    "langchain>=1.5.0",
    "langchain-core>=1.8.0",
    "langchain-anthropic>=1.7.10",
    "langchain-openai>=1.8.0",
    "langchain-google-genai>=4.5.0",
    "langchain-ollama>=1.1.0",
    "github-copilot-sdk>=1.0.34,<2.0",
    # Coding-agent engines. Each SDK bundles (Claude Code) or auto-installs (Codex)
    # its own CLI runtime, so no Node/npm or separate CLI install is required. These
    # are first-class engines the product offers, so they ship in the base install
    # (alongside github-copilot-sdk) rather than as optional extras.
    "claude-agent-sdk>=0.2.182",
    "openai-codex>=0.169.0",
    "jsonschema>=4.26.0",
    "PyYAML>=6.0.3",
    "langsmith>=0.14.17",
    # Cloud runtime SDKs. These sit alongside `docker` and `kubernetes` in the
    # base install because a deployment picks its backend at runtime with an env
    # var, and the image is built from the base wheel with no extras. The worker
    # launcher, the Azure Blob file-storage provider, and the ACI sandbox backend
    # import them lazily, so a local install never pays to load them.
    "azure-identity>=1.27.0",
    "azure-storage-blob>=12.31.1",
    "azure-mgmt-appcontainers>=5.1.0",
    "azure-mgmt-containerinstance>=11.0.0",
    # ACI exec is a raw WebSocket (password frame first, then output frames).
    "websockets>=17.4.0",
]

[project.urls]
Homepage = "https://github.com/kahinton/lucent"
Repository = "https://github.com/kahinton/lucent"
Issues = "https://github.com/kahinton/lucent/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
ollama = [
    "langchain-ollama>=1.1.0",
]
otel = [
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-asyncpg>=0.66b2",
    "opentelemetry-instrumentation-logging>=0.66b2",
]
# Optional native tool handlers. Deliberately NOT base dependencies: they are
# pulled in only when a Docker build sets the matching LUCENT_TOOLS_ENABLE_*
# build arg (see Dockerfile), so the default image stays lean and the
# supply-chain surface of a deployment is unchanged unless it opts in.
tools-documents = [
    "pypdf>=6.1.0,<7.0",
    "python-docx>=1.2.0,<2.0",
    "openpyxl>=3.1.5,<4.0",
]
tools-images = [
    "Pillow>=13.0.0,<14.0",
]

[project.scripts]
lucent = "lucent.server:main"
lucent-daemon = "daemon.daemon:main"
# Provisioning CLIs. `lucent-migrate` applies (or rolls back) schema migrations
# and exits; `lucent-bootstrap` creates the first user/org/model non-interactively
# so a fresh instance can be provisioned without a browser.
lucent-migrate = "lucent.migrate:main"
lucent-bootstrap = "lucent.bootstrap:main"
# Instance-operator (hyperadmin) account management. Needs direct DB access;
# it is the only way to grant the cross-tenant operator role.
lucent-hyperadmin = "lucent.hyperadmin:main"
# Standalone local org-admin console (a client of the hyperadmin API).
lucent-ops-console = "ops_console.app:main"

[tool.hatch.build.targets.wheel]
# The daemon is a top-level package (not under src/). It must be listed
# explicitly or it is silently omitted from the wheel — which is what made the
# production image unable to run a daemon at all. Keep both entries.
# ``ops_console`` is the standalone local org-admin console: also a top-level
# package, and deliberately *not* part of the server image's runtime surface.
packages = ["src/lucent", "daemon", "ops_console"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests", "src/tests"]
# Standard `pytest` runs unit tests only. DB-backed tests are auto-marked
# "integration" by tests/conftest.py's fixture-graph classifier (any test
# pulling in the `db_pool` fixture, directly or transitively) — the mark can't
# drift from reality because it is derived, not hand-maintained. Run the
# database suite explicitly: `pytest -m integration` (needs the isolated
# test database container; run scripts/dev-test-db.sh — see tests/conftest.py).
addopts = "-m 'not integration'"
markers = [
    "unit: tests that do not require the PostgreSQL test database",
    "integration: tests whose fixture graph uses the PostgreSQL test database",
]
