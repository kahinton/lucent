[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lucent"
version = "0.4.0"
description = "Enterprise AI agent platform for durable memory, governed work, and model orchestration"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Lucent Source Available License 1.0"}
authors = [
    { name = "kahinton" }
]
dependencies = [
    "mcp[cli]>=2.0.0,<3.0",
    "asyncpg>=0.31.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "fastapi>=0.141.1,<1.0",
    "uvicorn>=0.52.3",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32,<1.0",
    "bcrypt>=5.0.0",
    "PyNaCl>=1.6.2",
    "docker>=7.2.0",
    "kubernetes>=33.1.0,<34.0.0",
    "httpx>=0.28.1",
    "cryptography>=50.0.0,<51.0",
    "requests>=2.34.2,<3.0",
    "pyasn1>=0.6.4,<1.0",
    "pygments>=2.20.0,<3.0",
    "PyJWT>=2.13.0,<3.0",
    "langchain>=1.3.15",
    "langchain-core>=1.5.4",
    "langchain-anthropic>=1.5.6",
    "langchain-openai>=1.5.0",
    "langchain-google-genai>=4.3.3",
    "langchain-ollama>=1.1.0",
    "github-copilot-sdk>=1.0.9,<2.0",
    # Coding-agent engines. Each SDK bundles (Claude Code) or auto-installs (Codex)
    # its own CLI runtime, so no Node/npm or separate CLI install is required. These
    # are first-class engines the product offers, so they ship in the base install
    # (alongside github-copilot-sdk) rather than as optional extras.
    "claude-agent-sdk>=0.2.165",
    "openai-codex>=0.162.1",
    "jsonschema>=4.26.0",
    "PyYAML>=6.0.3",
    "langsmith>=0.11.0",
    # Cloud runtime SDKs. These sit alongside `docker` and `kubernetes` in the
    # base install because a deployment picks its backend at runtime with an env
    # var, and the image is built from the base wheel with no extras. The worker
    # launcher, the Azure Blob file-storage provider, and the ACI sandbox backend
    # import them lazily, so a local install never pays to load them.
    "azure-identity>=1.26.0",
    "azure-storage-blob>=12.25.0",
    "azure-mgmt-appcontainers>=5.1.0",
    "azure-mgmt-containerinstance>=10.1.0",
    # ACI exec is a raw WebSocket (password frame first, then output frames).
    "websockets>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/kahinton/lucent"
Repository = "https://github.com/kahinton/lucent"
Issues = "https://github.com/kahinton/lucent/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]
ollama = [
    "langchain-ollama>=1.1.0",
]
otel = [
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-asyncpg>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
]

[project.scripts]
lucent = "lucent.server:main"
lucent-daemon = "daemon.daemon:main"
# Provisioning CLIs. `lucent-migrate` applies (or rolls back) schema migrations
# and exits; `lucent-bootstrap` creates the first user/org/model non-interactively
# so a fresh instance can be provisioned without a browser.
lucent-migrate = "lucent.migrate:main"
lucent-bootstrap = "lucent.bootstrap:main"

[tool.hatch.build.targets.wheel]
# The daemon is a top-level package (not under src/). It must be listed
# explicitly or it is silently omitted from the wheel — which is what made the
# production image unable to run a daemon at all. Keep both entries.
packages = ["src/lucent", "daemon"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests", "src/tests"]
# Standard `pytest` runs unit tests only. DB-backed tests are auto-marked
# "integration" by tests/conftest.py's fixture-graph classifier (any test
# pulling in the `db_pool` fixture, directly or transitively) — the mark can't
# drift from reality because it is derived, not hand-maintained. Run the
# database suite explicitly: `pytest -m integration` (needs the isolated
# test database container; run scripts/dev-test-db.sh — see tests/conftest.py).
addopts = "-m 'not integration'"
markers = [
    "unit: tests that do not require the PostgreSQL test database",
    "integration: tests whose fixture graph uses the PostgreSQL test database",
]
