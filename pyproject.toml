[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lucent"
version = "0.4.0"
description = "Enterprise AI agent platform for durable memory, governed work, and model orchestration"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Lucent Source Available License 1.0"}
authors = [
    { name = "kahinton" }
]
dependencies = [
    "mcp[cli]>=2.0.0,<3.0",
    "asyncpg>=0.31.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "fastapi>=0.141.1,<1.0",
    "uvicorn>=0.52.3",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32,<1.0",
    "bcrypt>=5.0.0",
    "PyNaCl>=1.6.2",
    "docker>=7.2.0",
    "kubernetes>=33.1.0,<34.0.0",
    "httpx>=0.28.1",
    "cryptography>=50.0.0,<51.0",
    "requests>=2.34.2,<3.0",
    "pyasn1>=0.6.4,<1.0",
    "pygments>=2.20.0,<3.0",
    "PyJWT>=2.13.0,<3.0",
    "langchain>=1.3.15",
    "langchain-core>=1.5.4",
    "langchain-anthropic>=1.5.6",
    "langchain-openai>=1.5.0",
    "langchain-google-genai>=4.3.3",
    "langchain-ollama>=1.1.0",
    "github-copilot-sdk>=1.0.9,<2.0",
    "jsonschema>=4.26.0",
    "PyYAML>=6.0.3",
    "langsmith>=0.11.0",
]

[project.urls]
Homepage = "https://github.com/kahinton/lucent"
Repository = "https://github.com/kahinton/lucent"
Issues = "https://github.com/kahinton/lucent/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]
ollama = [
    "langchain-ollama>=1.1.0",
]
otel = [
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-asyncpg>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
]

[project.scripts]
lucent = "lucent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lucent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "unit: tests that do not require the PostgreSQL test database",
    "integration: tests whose fixture graph uses the PostgreSQL test database",
]
