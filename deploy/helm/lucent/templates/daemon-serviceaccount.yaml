{{- if and .Values.daemon.enabled .Values.daemon.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lucent.daemonServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lucent.labels" . | nindent 4 }}
    app.kubernetes.io/component: daemon
  {{- with .Values.daemon.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The controller needs a token to create worker Jobs through the API server.
automountServiceAccountToken: true
{{- end }}
