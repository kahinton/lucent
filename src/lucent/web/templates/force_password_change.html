<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Change Password - Lucent</title>
    <script src="/static/vendor/tailwindcss-3.4.17.js"></script>
    <script nonce="{{ request.state.csp_nonce }}">
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#e6fffb', 100: '#bffaf2', 200: '#7feee4', 300: '#3ee0d6',
                            400: '#00d4c7', 500: '#00b8ad', 600: '#00968f', 700: '#08766f',
                            800: '#0b5d59', 900: '#0d4846', 950: '#072b2a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            color-scheme: dark;
            --password-black: #080808;
            --password-panel: rgba(18, 18, 18, 0.78);
            --password-line: rgba(255, 255, 255, 0.15);
            --password-text: #faf9f6;
            --password-muted: #9d9995;
            --password-teal: #00cfc1;
            --password-pink: #ff3f9b;
            --password-yellow: #ffd84d;
        }
        html { background: var(--password-black); }
        body {
            position: relative;
            overflow: hidden;
            padding: 2rem 1rem;
            color: var(--password-text);
            background-color: var(--password-black) !important;
            background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.018) 0, rgba(255, 255, 255, 0.018) 1px, transparent 1px, transparent 12px);
        }
        .password-shell { position: relative; z-index: 1; }
        .password-logo { filter: drop-shadow(0 8px 16px rgba(255, 63, 155, 0.2)); }
        .password-card {
            position: relative;
            overflow: hidden;
            background: var(--password-panel) !important;
            border-color: var(--password-line) !important;
            border-radius: 0.5rem;
            box-shadow: inset 0 1px rgba(255, 255, 255, 0.08), 0 6px 0 #000, 0 24px 60px rgba(0, 0, 0, 0.46);
            backdrop-filter: blur(22px) saturate(135%);
            -webkit-backdrop-filter: blur(22px) saturate(135%);
        }
        .password-title, .password-heading { color: var(--password-text) !important; }
        .password-subtitle, .password-label, .password-rule { color: var(--password-muted) !important; }
        .password-notice {
            color: #fff0a8 !important;
            background: rgba(255, 216, 77, 0.1) !important;
            border-color: rgba(255, 216, 77, 0.38) !important;
        }
        .password-error {
            color: #ffd2e7 !important;
            background: rgba(255, 63, 155, 0.12) !important;
            border-color: rgba(255, 63, 155, 0.45) !important;
        }
        @media all {
            body { background-color: var(--password-black) !important; }
            input {
                background-color: rgba(5, 5, 5, 0.72) !important;
                color: var(--password-text) !important;
                border-color: #424242 !important;
                border-radius: 0.4rem !important;
                box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.55);
            }
            input::placeholder { color: #706d6a !important; }
            input:focus {
                border-color: var(--password-teal) !important;
                box-shadow: 0 0 0 3px rgba(0, 207, 193, 0.16), inset 0 1px 4px rgba(0, 0, 0, 0.55) !important;
            }
        }
        .password-submit {
            color: #050505 !important;
            background: var(--password-pink) !important;
            border-radius: 0.4rem;
            box-shadow: 0 4px 0 #971950, 0 10px 22px rgba(255, 63, 155, 0.2);
        }
        .password-submit:hover { background: #ff5baa !important; transform: translateY(-1px); }
        .password-submit:active { transform: translateY(2px); box-shadow: 0 1px 0 #971950; }
        @media (max-width: 480px) {
            body { align-items: flex-start !important; padding-top: max(2rem, env(safe-area-inset-top)); overflow-y: auto; }
            .password-card { padding: 1.5rem !important; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="password-shell w-full max-w-md">
        <div class="flex flex-col items-center mb-8">
            <img src="/static/lucent_logo_128.png" alt="Lucent" class="password-logo h-16 mb-4">
            <h1 class="password-title text-2xl font-bold">Lucent</h1>
            <p class="password-subtitle text-sm mt-1">AI Teammate</p>
        </div>

        <div class="password-card border p-8">
            <h2 class="password-heading text-lg font-semibold mb-2">Set a new password</h2>
            <p class="password-subtitle text-sm mb-5">Your administrator reset your password. Choose a new one to continue.</p>

            <div class="password-notice mb-5 border rounded-lg px-3 py-2.5 text-xs">
                You will be signed in after your password is updated.
            </div>

            {% if error %}
            <div class="password-error mb-4 p-3 border rounded-lg text-sm">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/force-password-change" class="space-y-4">
                <input type="hidden" name="{{ csrf_field_name }}" value="{{ csrf_token }}">
                <div>
                    <label for="new_password" class="password-label block text-sm font-medium mb-1">
                        New Password
                    </label>
                    <input
                        type="password"
                        id="new_password"
                        name="new_password"
                        placeholder="Enter new password"
                        required
                        minlength="8"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                    >
                </div>
                <div>
                    <label for="confirm_password" class="password-label block text-sm font-medium mb-1">
                        Confirm Password
                    </label>
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        required
                        minlength="8"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                    >
                </div>
                <p class="password-rule text-xs">
                    Must be at least 8 characters with uppercase, lowercase, and a digit.
                </p>
                <button type="submit" class="password-submit w-full py-2.5 px-4 font-semibold text-sm transition-all">
                    Set New Password
                </button>
            </form>
        </div>
    </div>
</body>
</html>
